name: Deploy to GitHub Pages
on:
  push:
    # main only. The github-pages environment allows deploys from `main` and
    # `claude/*` and nothing else, so a push to any other branch started a run
    # that cancelled main's in-flight deploy (concurrency group `pages`,
    # cancel-in-progress) and then failed at the deploy step itself — the site
    # silently kept serving the previous build. v2-app stays as the branch the
    # build spec names; it just does not publish.
    branches: [main]
    paths-ignore: ['design/**', 'shots/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase env is baked in at build time. Both are safe to expose in the
      # client (the anon key is gated by row-level security); when either is
      # unset the build falls back to local-only mode.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
