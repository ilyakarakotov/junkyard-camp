<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable are honored from the home screen (this app
         declares apple-mobile-web-app-capable) even though Safari tabs ignore
         them; interactive-widget makes the on-screen keyboard resize instead
         of overlaying. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#16110D" />
    <!-- Leaders open this from a phone home screen, so it needs an icon and a
         name short enough to survive the springboard. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS accepts raster only for the home-screen icon; the SVG made the
         springboard show a screenshot of the page instead. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Junkyard" />
    <title>Junkyard Redemption</title>
  </head>
  <body>
    <!-- The loading plate: the Junkyard Redemption marquee on the workshop
         wall, painted before a byte of JavaScript arrives. Inline styles on
         purpose — this must render with zero dependencies. The image's edges
         fade to the exact wall color (#16110D), so `contain` letterboxing is
         seamless at any aspect ratio. main.tsx fades it out on first paint. -->
    <div
      id="splash"
      aria-hidden="true"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        background: #16110d url('./splash.webp') center / contain no-repeat;
        transition: opacity 0.4s ease;
      "
    ></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
